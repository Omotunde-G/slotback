<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Appointment opening — SlotBack</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2">

    <link rel="stylesheet" href="/styles.css" />
    <script src="/slot.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <a class="logo" href="/">SlotBack<span>.</span></a>
    </header>

    <main class="dashboard">
      <p class="eyebrow">AN OPENING FOR YOU</p>

      <p id="slot-message" role="status" aria-live="polite">
        Loading appointment…
      </p>

      <article class="connection-card" id="public-slot" hidden>
        <p id="slot-business"></p>
        <h1 id="slot-service"></h1>

        <p id="slot-availability"></p>

        <dl class="appointment-details" id="slot-details"></dl>

        <p id="slot-description"></p>
        <form id="request-form" hidden>
  <h2>Request this opening</h2>

  <fieldset id="request-fields" class="request-fields">
    <div class="field">
      <label for="customer-name">Your name</label>
      <input
        id="customer-name"
        name="name"
        autocomplete="name"
        maxlength="120"
        required
      />
    </div>

    <div class="field">
      <label for="customer-email">Your email</label>
      <input
        id="customer-email"
        name="email"
        type="email"
        autocomplete="email"
        maxlength="254"
        required
      />
    </div>

    <div class="field">
      <label for="customer-message">Message (optional)</label>
      <textarea
        id="customer-message"
        name="message"
        maxlength="500"
        rows="3"
      ></textarea>
    </div>

    <p class="request-note">
      Your contact details are shared with this business to handle
      your request. They won’t appear on this public page.
    </p>

    <button class="button" type="submit">Request opening →</button>
  </fieldset>
</form>

<p id="request-result" role="status" aria-live="polite"></p>


        <p class="request-note">
          A request is not a confirmed booking. The business confirms
          who gets the appointment.
        </p>
      </article>

    </main>
  </body>
</html>
